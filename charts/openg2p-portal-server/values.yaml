hostname: portal.demo.openg2p.org
fullnameOverride: openg2p-portal-server

replicaCount: 1
image:
  repository: psnappz/openg2p-portal-server
  tag: "1.0"
  pullPolicy: Always

openapiRootPath: /api/portal

envVars:
  PORTAL_PORT: '{{ .Values.containerPort }}'
  PORTAL_DB_HOSTNAME: '{{ include "postgresql.v1.primary.fullname" .Subcharts.postgresql }}'
  PORTAL_DB_USERNAME: "portaluser"
  PORTAL_DB_DBNAME: "openg2pdb"
  PORTAL_OPENAPI_ROOT_PATH: '{{ tpl .Values.openapiRootPath $ }}'

envVarsFrom:
  PORTAL_DB_PASSWORD:
    secretKeyRef:
      name: '{{ include "postgresql.v1.primary.fullname" .Subcharts.postgresql }}'
      key: password

containerPort: 8000

service:
  type: ClusterIP
  port: 80

resources: {}
  #  requests:
  #    cpu: 500m
  #    memory: 2G

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

startupProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 5

livenessProbe:
  enabled: true
  httpGet:
    path: /ping
    port: http
  periodSeconds: 60
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 5

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  helm.sh/revision: '{{ .Release.Revision }}'

podSecurityContext:
  enabled: false
  # fsGroup: 2000

containerSecurityContext:
  enabled: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector: {}

tolerations: []

podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
affinity: {}

updateStrategy:
  type: RollingUpdate

command: []
args: []

postgresCheckerInit:
  enabled: true
  image:
    repository: jbergknoff/postgresql-client
    tag: latest
    pullPolicy: IfNotPresent
  command:
  - 'sh'
  args:
  - '-c'
  - 'until pg_isready -U ${PORTAL_DB_USERNAME} -h ${PORTAL_DB_HOSTNAME} -p ${PORTAL_DB_PORT:-5432} -d ${PORTAL_DB_DBNAME:-spar_db}; do sleep 3; done'
  containerSecurityContext:
    enabled: false

ingress:
  enabled: false
  ingressClassName: ""
  pathType: ImplementationSpecific
  backendServiceName: '{{ include "common.names.fullname" . }}'
  path: '{{ tpl .Values.openapiRootPath $ }}(/|$)(.*)'
  apiVersion: ""
  hostname: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  tls: false
  tlsSecret: ""
  extraPaths: []
  extraTls: []
  extraRules: []

istio:
  enabled: true
  virtualservice:
    enabled: true
    host: ""
    gateway: "internal"
    destination: '{{ include "common.names.fullname" . }}'
    destinationPort: '{{ .Values.service.port }}'
    prefix: '{{ tpl .Values.openapiRootPath $ }}/'
    rewriteUri: "/"
  gateway:
    enabled: false
    host: ""
    ingressController:
      istio: ingressgateway
    httpTlsRedirect: true
    httpEnabled: true
    httpsEnabled: false
    tls:
      mode: SIMPLE
      credentialName: ""

postgresql:
  enabled: true
  auth:
    username: portaluser
    database: openg2pdb
  additionalDbs:
    enabled: true
    userPasswordsExistingSecret: ""
    userPasswords:
      keymgruser: ""
  primary:
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 10

